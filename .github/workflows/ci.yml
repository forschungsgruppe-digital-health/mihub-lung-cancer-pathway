name: CI

# The BPMN conformance gate (naming + bpmnlint + model metrics + roundtrip + XSD core).
# Runs on PRs into and pushes to dev/main. The decision lives in the tools under
# tools/ — this workflow just runs the tools' own unit tests (`npm test`, tools/test/),
# `npm run check:naming` and `npm run check:conformance`.
#
# Layers (tools/check-conformance.mjs): the naming convention (ADR-0004), bpmnlint, model
# metrics (SYN-5) and the moddle roundtrip are BLOCKING — locally the gate runs STRICT by
# default; XSD core is INFORMATIONAL (reported, never blocks). In CI, during the
# release-candidate / pre-remodel phase, ALL layers run ADVISORY (warn-only) EXCEPT the
# naming convention, which a dedicated step enforces hard (ADR-0004 promises CI enforcement).
#
# NOTE: the current models are known-red (pre-existing structural defects + OR-gateways:
# 13 as of 2026-09-04 — treatment 2, aftercare 4, palliative-care 7; the live count is what
# `npm run check:conformance` prints) — see docs/decisions/0001 and docs/model-issues/.
# During the release-candidate / pre-remodel phase the aggregated gate runs in ADVISORY
# (warn-only) mode: it REPORTS every finding (as ::warning::) but does NOT fail the check, so
# it does not block release-candidate / model-refinement PRs. Re-enable enforcement after the
# remodel by removing CONFORMANCE_WARN_ONLY below (and then add it as a required check).

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

permissions:
  contents: read

jobs:
  conformance:
    name: BPMN conformance gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure xmllint is available (for XSD core validation)
        run: xmllint --version || (sudo apt-get update && sudo apt-get install -y libxml2-utils)

      # The tools' own unit tests (node:test, no extra dependency) — BLOCKING: a broken gate must
      # not silently pass the models. Runs after xmllint is present so the conformance-summary test
      # exercises the same XSD layer as the gate below.
      - name: Unit tests (tools)
        run: npm test

      # The naming convention (ADR-0004: lung-cancer-<phase>-pathway) is the ONE layer that stays
      # BLOCKING in CI during the RC phase: it is independent of the models' content, so the
      # known-red models are no excuse. It must run BEFORE the aggregated gate below, which would
      # downgrade a naming violation to a ::warning:: under CONFORMANCE_WARN_ONLY.
      - name: Model naming convention (ADR-0004) — blocking
        run: npm run check:naming

      # Blocking layers (local STRICT): naming + bpmnlint + model metrics (SYN-5) + moddle roundtrip.
      # Informational layer: XSD core (reported, never blocks). In CI all of them run advisory during
      # the RC phase (CONFORMANCE_WARN_ONLY below) — naming is enforced hard by the step above.
      - name: Conformance (naming + bpmnlint + metrics + roundtrip + XSD) — advisory during the RC phase
        env:
          # Warn-only: the gate reports all findings but exits 0 (does not fail the check) while the
          # models are known-red by design. Remove this line to re-enable hard enforcement after the
          # remodel greens the models (docs/model-issues/2026-06-25-baseline.md).
          CONFORMANCE_WARN_ONLY: 'true'
        run: npm run check:conformance
