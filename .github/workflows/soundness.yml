name: Soundness (advisory)

# Behavioural soundness (acceptance-test STR-1..4) via rust_bpmn_analyzer (pinned by digest),
# run as a service container. ADVISORY / non-blocking: it reports SOUND / VIOLATION /
# INCONCLUSIVE per model and never fails the build. At the 2026-06-25 pilot (7 models then)
# 4 were INCONCLUSIVE (unsupported OR-gateways + intermediate catch events) and the
# analyzable ones violated on pre-existing defects — see docs/decisions/0003 and the latest
# run output for the current 10-model set. Flip to `--strict` (blocking) only after the
# model remodel.

# Runs on pushes to main/dev as well as on PRs: the README status badge for this workflow
# filters on branch=dev, so it needs runs on the branch itself, not only on pull requests.
# The paths cover the wrapper plus everything it imports or is installed from (bpmn-files,
# element-names, package.json + the lockfile).
on:
  push:
    branches: [main, dev]
    paths:
      - "**/*.bpmn"
      - "tools/check-soundness.mjs"
      - "tools/bpmn-files.mjs"
      - "tools/element-names.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/soundness.yml"
  pull_request:
    branches: [main, dev]
    paths:
      - "**/*.bpmn"
      - "tools/check-soundness.mjs"
      - "tools/bpmn-files.mjs"
      - "tools/element-names.mjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/soundness.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  soundness:
    name: soundness (advisory)
    runs-on: ubuntu-latest
    services:
      analyzer:
        # Pinned by digest (see docs/decisions/0003). The image is the webserver binary
        # and binds 0.0.0.0:8080; mapped to localhost:8090 on the runner.
        image: tkra/rust_bpmn_analyzer@sha256:9d939b84e82ca0ef55e9b34847d55bacd32b293fc7ef670e53d37d2ebcd3778c
        ports:
          - 8090:8080
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for the analyzer
        run: |
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:8090/; then echo "analyzer ready"; exit 0; fi
            sleep 1
          done
          echo "analyzer not ready — the wrapper will skip (advisory)."

      - name: Soundness (advisory, non-blocking)
        env:
          SOUNDNESS_URL: http://localhost:8090/check_bpmn
        run: node tools/check-soundness.mjs
