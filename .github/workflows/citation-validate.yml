name: Validate CITATION.cff

# An invalid CITATION.cff silently aborts the Zenodo publish on release, so we
# validate it against the Citation File Format schema on any change. Blocking.
# .zenodo.json (read by Zenodo from the repository at release time; it takes precedence
# over CITATION.cff) must stay in sync with CITATION.cff — the second step checks that.

on:
  pull_request:
    branches: [main, dev]
    paths: ["CITATION.cff", ".zenodo.json", ".github/workflows/citation-validate.yml"]
  push:
    branches: [main, dev]
    paths: ["CITATION.cff", ".zenodo.json", ".github/workflows/citation-validate.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: cff schema validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Validate CITATION.cff
        uses: dieghernan/cff-validator@d8f85828214016ce6976e740b6e0504c0fdc4dbb # v5.1.1

      # Zenodo reads .zenodo.json via the GitHub API at release time and prefers it over
      # CITATION.cff, so the two must agree: resource type (dataset), authors (ORCIDs +
      # count), title, licence and keywords. jq ships with the ubuntu runner image.
      - name: Validate .zenodo.json and its sync with CITATION.cff
        run: |
          set -euo pipefail
          fail() { echo "::error file=.zenodo.json::$1"; exit 1; }

          jq -e . .zenodo.json >/dev/null 2>&1 || fail ".zenodo.json is not valid JSON"

          upload_type="$(jq -r '.upload_type // empty' .zenodo.json)"
          [ "$upload_type" = "dataset" ] || fail ".zenodo.json upload_type is '$upload_type' — expected 'dataset'"
          cff_type="$(grep -E '^type:' CITATION.cff | head -n 1 | sed -E 's/^type:[[:space:]]*//; s/[[:space:]]+$//')"
          [ "$cff_type" = "dataset" ] || fail "CITATION.cff type is '$cff_type' — expected 'dataset' (must match .zenodo.json upload_type)"

          zenodo_orcids="$(jq -r '.creators[].orcid' .zenodo.json | sort)"
          cff_orcids="$(grep -oE '[0-9]{4}-[0-9]{4}-[0-9]{4}-[0-9]{3}[0-9X]' CITATION.cff | sort || true)"
          [ "$zenodo_orcids" = "$cff_orcids" ] || fail "ORCID mismatch — .zenodo.json: $(echo "$zenodo_orcids" | tr '\n' ' ')| CITATION.cff: $(echo "$cff_orcids" | tr '\n' ' ')"

          zenodo_creators="$(jq -r '.creators | length' .zenodo.json)"
          cff_authors="$(grep -cE '^[[:space:]]*family-names:' CITATION.cff || true)"
          [ "$zenodo_creators" = "$cff_authors" ] || fail "creator count mismatch — .zenodo.json has $zenodo_creators creators, CITATION.cff has $cff_authors family-names entries"

          title="$(jq -r '.title // empty' .zenodo.json)"
          [ -n "$title" ] || fail ".zenodo.json has no title"
          grep -qF -- "$title" CITATION.cff || fail "title '$title' from .zenodo.json does not appear verbatim in CITATION.cff"

          # Licence: Zenodo spells its ids lower-case (cc-by-4.0), CITATION.cff uses the SPDX id
          # (CC-BY-4.0) — the same identifier, so compare both lower-cased.
          zenodo_license="$(jq -r '.license // empty' .zenodo.json | tr '[:upper:]' '[:lower:]')"
          [ -n "$zenodo_license" ] || fail ".zenodo.json has no license"
          cff_license="$(grep -E '^license:' CITATION.cff | head -n 1 | sed -E 's/^license:[[:space:]]*//; s/[[:space:]]+#.*$//; s/^"//; s/"[[:space:]]*$//; s/[[:space:]]+$//' | tr '[:upper:]' '[:lower:]' || true)"
          [ -n "$cff_license" ] || fail "CITATION.cff has no license: entry"
          [ "$zenodo_license" = "$cff_license" ] || fail "license mismatch — .zenodo.json: '$zenodo_license' | CITATION.cff: '$cff_license' (compared lower-cased)"

          # Keywords: sorted-set equality between .zenodo.json `keywords` and the items of the
          # CITATION.cff `keywords:` list (surrounding quotes stripped; order is irrelevant).
          zenodo_keywords="$(jq -r '.keywords[]' .zenodo.json | sort -u)"
          cff_keywords="$(awk '/^keywords:/ { f = 1; next }
                               f && /^[ \t]*$/ { next }
                               f && /^[ \t]+-[ \t]*/ { sub(/^[ \t]+-[ \t]*/, ""); sub(/[ \t]+$/, ""); gsub(/^"|"$/, ""); print; next }
                               f { exit }' CITATION.cff | sort -u)"
          [ -n "$cff_keywords" ] || fail "CITATION.cff has no keywords: list"
          [ "$zenodo_keywords" = "$cff_keywords" ] || fail "keyword mismatch — .zenodo.json: [$(echo "$zenodo_keywords" | paste -sd ',' -)] | CITATION.cff: [$(echo "$cff_keywords" | paste -sd ',' -)]"

          echo ".zenodo.json OK: dataset, $zenodo_creators creators (ORCIDs match); title, license ($zenodo_license) and $(echo "$zenodo_keywords" | wc -l | tr -d ' ') keywords match CITATION.cff"
