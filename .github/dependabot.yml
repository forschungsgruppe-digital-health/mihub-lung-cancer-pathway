# Keeps the SHA-pinned GitHub Actions in .github/workflows/ current: Dependabot bumps the
# commit SHA and rewrites the `# vX.Y.Z` comment behind it (monthly). Only the Actions
# ecosystem is covered here; the npm devDependencies are intentionally out of scope.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
